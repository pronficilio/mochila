[Unit]
Wants=network-online.target tailscaled.service mochila-render-danted-config.service
After=network-online.target tailscaled.service mochila-render-danted-config.service
Requires=mochila-render-danted-config.service

[Service]
Restart=always
RestartSec=5
# This bind mount is private to danted's systemd mount namespace. It does not
# modify /etc/gai.conf or DNS behavior for the rest of home-mini.
BindReadOnlyPaths=/etc/mochila-home-egress/danted-gai.conf:/etc/gai.conf
